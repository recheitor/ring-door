#cloud-config
package_update: true
packages:
  - git
runcmd:
  - curl -fsSL https://get.docker.com | sh
  - usermod -aG docker ubuntu
  - git clone https://github.com/recheitor/ring-door.git /opt/ring-door
  - echo "Repo en /opt/ring-door/double-ring. Rellena .env y ejecuta 'docker compose up -d'."
